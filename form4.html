<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<!-- Menyematkan video YouTube -->
<!-- Ambil kode embed dari tombol Share > Embed di YouTube -->
<iframe width="560" height="315"
  src="https://youtu.be/MYK87q82c80?si=D0zxtCR7c37tOT8w"
  title="judul video"

  frameborder="0"
  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope"
  allowfullscreen>
</iframe>

<!-- Menyematkan Google Maps -->
<!-- Ambil kode embed dari Google Maps > Share > Embed a map -->
<iframe
  src="https://maps.app.goo.gl/whCEroRsrBBQMMyr8"
  width="600" height="450"
  style="border : 0; "
  allowfullscreen=""
  loading="lazy">
</iframe>

<!-- iFrame biasa ke halaman web lain -->
<iframe src="https://example.com" width="800" height="400"
        title="Halaman Contoh" framborder="0">
</iframe>
</body>
</html>
